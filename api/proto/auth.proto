syntax = "proto3";

package api;

option go_package = "./api";

import "api.proto";

service AuthService {
  rpc Register(RegisterRequest) returns (Status) {}
  rpc Login(AuthRequest) returns (AuthResponse) {}
  rpc Validate(Token) returns (Status) {}
  rpc Logout(Token) returns (Status) {}
}

message AuthRequest {
  string Username = 1;
  string Password = 2;
}

message RegisterRequest {
  string Username = 1;
  string Email = 2;
  string Password = 3;
}

message AuthResponse {
  string AccessToken = 1;
  string RefreshToken = 2;
}

message Token {
  string Token = 1;
}
