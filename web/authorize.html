<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authorize - ZenithSSO</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .box {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 300px;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #0056b3;
        }

        .link {
            display: block;
            text-align: center;
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #007bff;
            text-decoration: none;
        }

        .link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="box">
    <h2 style="text-align: center; margin-top: 0;">Sign In</h2>
    <form id="authForm" action="/api/v1/authorize" method="POST">
        <input type="hidden" id="client_id" name="client_id">
        <input type="hidden" id="redirect_uri" name="redirect_uri">
        <input type="hidden" id="state" name="state">
        <input type="hidden" id="code_challenge" name="code_challenge">
        <input type="hidden" id="code_challenge_method" name="code_challenge_method">

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit">Authorize</button>
    </form>
    <a href="/register.html" class="link">Don't have an account? Register</a>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    document.getElementById('client_id').value = urlParams.get('client_id') || '';
    document.getElementById('redirect_uri').value = urlParams.get('redirect_uri') || '';
    document.getElementById('state').value = urlParams.get('state') || '';
    document.getElementById('code_challenge').value = urlParams.get('code_challenge') || '';
    document.getElementById('code_challenge_method').value = urlParams.get('code_challenge_method') || '';
</script>

</body>
</html>
