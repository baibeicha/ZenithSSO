<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - ZenithSSO</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="sso-card">
    <h2>Регистрация</h2>
    <p class="subtitle">Создайте новый аккаунт ZenithSSO</p>

    <div id="error-msg" class="error-message"></div>
    <div id="success-msg"
         style="display: none; color: #16a34a; background: #dcfce7; padding: 0.75rem; border-radius: 6px; font-size: 0.875rem; margin-bottom: 1rem;"></div>

    <form id="register-form">
        <div class="form-group">
            <label for="username">Имя пользователя</label>
            <input type="text" id="username" name="username" required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" required>
        </div>

        <button type="submit" class="btn">Зарегистрироваться</button>
    </form>

    <p style="margin-top: 1.5rem; font-size: 0.875rem;">
        Уже есть аккаунт? <a href="authorize.html" id="login-link"
                             style="color: var(--primary-color); text-decoration: none;">Войти</a>
    </p>
</div>

<script src="/static/js/auth.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const loginLink = document.getElementById('login-link');
        if (window.location.search) {
            loginLink.href = "/authorize.html" + window.location.search;
        }

        document.getElementById('register-form').addEventListener('submit', async function (e) {
            e.preventDefault();

            const errorDiv = document.getElementById('error-msg');
            const successDiv = document.getElementById('success-msg');
            const submitBtn = this.querySelector('button[type="submit"]');

            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            submitBtn.disabled = true;

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/v1/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({username, email, password})
                });

                const data = await response.json();

                if (!response.ok || data.error) {
                    errorDiv.innerText = data.error || 'Ошибка при регистрации. Попробуйте еще раз.';
                    errorDiv.style.display = 'block';
                    submitBtn.disabled = false;
                } else {
                    successDiv.innerText = 'Успешная регистрация! Перенаправляем...';
                    successDiv.style.display = 'block';

                    setTimeout(() => {
                        window.location.href = loginLink.href;
                    }, 1500);
                }
            } catch (err) {
                errorDiv.innerText = 'Ошибка сети. Проверьте подключение к интернету.';
                errorDiv.style.display = 'block';
                submitBtn.disabled = false;
            }
        });
    });
</script>
</body>
</html>
