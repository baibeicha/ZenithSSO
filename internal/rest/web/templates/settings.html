<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки - ZenithSSO</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="sso-card">
    <h2>Настройки профиля</h2>
    <p class="subtitle">Управление данными аккаунта {{.User.Username}}</p>

    {{if .Error}}
    <div class="error-message" style="display: block;">{{.Error}}</div>
    {{end}}
    {{if .Success}}
    <div style="color: #16a34a; background: #dcfce7; padding: 0.75rem; border-radius: 6px; font-size: 0.875rem; margin-bottom: 1rem;">{{.Success}}</div>
    {{end}}

    {{if .IsAdmin}}
    <div style="margin-bottom: 1.5rem; text-align: left;"><a href="/admin" style="color: var(--primary-color); text-decoration: none; font-size: 0.875rem;">&rarr; Перейти в Админ панель</a></div>
    {{end}}

    <form action="/settings" method="POST">
        <div class="form-group">
            <label for="first_name">Имя</label>
            <input type="text" id="first_name" name="first_name" value="{{if .User.FirstName}}{{.User.FirstName}}{{end}}">
        </div>

        <div class="form-group">
            <label for="last_name">Фамилия</label>
            <input type="text" id="last_name" name="last_name" value="{{if .User.LastName}}{{.User.LastName}}{{end}}">
        </div>

        <div class="form-group">
            <label for="avatar_url">URL аватара</label>
            <input type="url" id="avatar_url" name="avatar_url" value="{{if .User.AvatarURL}}{{.User.AvatarURL}}{{end}}">
        </div>

        <div class="form-group">
            <label for="locale">Язык (локаль)</label>
            <input type="text" id="locale" name="locale" value="{{if .User.Locale}}{{.User.Locale}}{{end}}" placeholder="ru">
        </div>

        <button type="submit" class="btn">Сохранить</button>
    </form>

    <div style="margin-top: 1.5rem;">
        <form action="/logout" method="POST">
            <button type="submit" class="btn secondary">Выйти из аккаунта</button>
        </form>
    </div>
</div>
</body>
</html>
