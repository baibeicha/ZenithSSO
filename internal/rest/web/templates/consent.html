<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{call .T "consent_page_title"}} - ZenithSSO</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="sso-card">
    <h2>{{call .T "consent_title"}}</h2>
    <p class="subtitle">{{call .T "consent_message_part1"}} <strong id="app-name" class="text-dark">[Client App]</strong> {{call .T "consent_message_part2"}}</p>

    <div class="scopes-box">
        <p class="m-0 font-weight-500">{{call .T "consent_permissions"}}</p>
        <ul id="scopes-list">
        </ul>
    </div>

    <form action="/api/v1/consent" method="POST">
        <div id="hidden_oauth_params"></div>

        <button type="submit" class="btn">{{call .T "authorize_button"}}</button>
        <button type="button" class="btn secondary" onclick="history.back()">{{call .T "deny_button"}}</button>
    </form>
</div>
<script src="/static/js/consent.js"></script>
</body>
</html>
